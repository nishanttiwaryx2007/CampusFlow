{% extends "base.html" %}{% block title %}{{title}}{% endblock %}{% block crumb %}Students / {{title}}{% endblock %}{% block content %}<div class="heading"><div><small class="eyebrow">STUDENT DIRECTORY</small><h1>{{title}}</h1><p class="muted">Enter the student's details below.</p></div><a class="btn btn-light" href="{{url_for('students')}}">← Back</a></div><form method="post" class="panel form-panel"><h3>Personal information</h3><div class="row g-3"><div class="col-md-6"><label>Full name *</label><input class="form-control" name="name" required value="{{student.name if student else ''}}" placeholder="e.g. Aanya Sharma"></div><div class="col-md-6"><label>Roll number *</label><input class="form-control" name="roll" required value="{{student.roll if student else ''}}" placeholder="e.g. CSE001"></div><div class="col-md-6"><label>Email</label><input class="form-control" type="email" name="email" value="{{student.email if student else ''}}"></div><div class="col-md-6"><label>Phone</label><input class="form-control" name="phone" value="{{student.phone if student else ''}}"></div><div class="col-md-4"><label>Course *</label><input class="form-control" name="course" required value="{{student.course if student else ''}}" placeholder="Computer Science"></div><div class="col-md-4"><label>Grade</label><select class="form-select" name="grade">{% for g in ['N/A','A+','A','B+','B','C','D','F'] %}<option {% if student and student.grade==g %}selected{% endif %}>{{g}}</option>{% endfor %}</select></div><div class="col-md-4"><label>Attendance (%)</label><input class="form-control" type="number" name="attendance" min="0" max="100" step=".1" value="{{student.attendance if student else 0}}"></div></div><div class="form-actions"><a class="btn btn-light" href="{{url_for('students')}}">Cancel</a><button class="btn btn-primary">{{'Save changes' if student else 'Create student record'}} →</button></div></form>{% endblock %}
